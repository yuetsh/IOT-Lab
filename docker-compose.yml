services:
  app:
    build: .
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./server/uploads:/app/uploads
      - dist_share:/dist-share
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dist_share:/usr/share/caddy:ro
    restart: unless-stopped
    depends_on:
      - app

volumes:
  dist_share:
